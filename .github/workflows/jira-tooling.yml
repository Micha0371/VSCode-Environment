name: Jira local tooling
on:
  pull_request:
    paths: ['tools/jira/**', '.github/workflows/jira-tooling.yml']
  push:
    branches: [main]
    paths: ['tools/jira/**', '.github/workflows/jira-tooling.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jira-fixtures:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools/jira -p test_*.py -v
