appId: com.pantryflow.test
---
- tapOn:
    id: login-email
    point: "95%,50%"
- eraseText
- inputText: ${EMAIL}
- assertVisible:
    id: login-email
    text: ${EMAIL}
- tapOn:
    id: login-password
    point: "95%,50%"
- eraseText
- inputText: PF-local-test-only-9281!
- hideKeyboard
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: pantry-screen
    timeout: 30000
